
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Cognifyz | Interactive Color Studio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <div class="icon">✦</div>

        <button id="colorButton">
            <span>✧</span> Change Background
        </button>

        <p id="message" aria-live="polite">Your creativity starts here.</p>

        <div class="color-section">
            <p>EXPLORE THE PALETTE</p>
            <div class="palette">
                <span class="color color1"></span>

                <span class="color color3"></span>
                <span class="color color4"></span>
                <span class="color color5"></span>
